name: Daily iOS Anti-Revoke Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: Enable debug logging
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-ios-antirevoke-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Write and validate signing credentials
        id: signing
        env:
          SSL_CERT: ${{ secrets.SSL_CERT }}
          SSL_KEY: ${{ secrets.SSL_KEY }}
        run: |
          # Signing is optional. A fork normally has no SSL_CERT / SSL_KEY
          # secrets, and an unsigned mobileconfig installs and works exactly
          # like a signed one (iOS only shows an "Unsigned" label). When the
          # secrets are absent we publish unsigned profiles instead of failing
          # the whole run.
          if [ -z "$SSL_CERT" ] || [ -z "$SSL_KEY" ]; then
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "No signing credentials configured; will publish unsigned profiles."
            exit 0
          fi
          printf '%s\n' "$SSL_CERT" > fullchain.pem
          printf '%s\n' "$SSL_KEY" > privkey.pem
          chmod 600 fullchain.pem privkey.pem
          openssl x509 -in fullchain.pem -noout -subject -dates
          openssl pkey -in privkey.pem -check -noout
          # Fail here rather than silently signing every daily build with a
          # certificate that has already expired.
          if ! openssl x509 -in fullchain.pem -noout -checkend 0; then
            echo "Signing certificate is expired or not yet valid." >&2
            exit 1
          fi
          echo "signing=true" >> "$GITHUB_OUTPUT"

      - name: Run discovery and generation pipeline
        env:
          SSL_CERT_PATH: ${{ steps.signing.outputs.signing == 'true' && 'fullchain.pem' || '' }}
          SSL_KEY_PATH: ${{ steps.signing.outputs.signing == 'true' && 'privkey.pem' || '' }}
          DEBUG_MODE: ${{ inputs.debug || false }}
          # Set a BACKEND_HOST repository variable to point the generated
          # profiles at your own DoH resolver instead of upstream's.
          BACKEND_HOST: ${{ vars.BACKEND_HOST }}
        run: |
          if [ "$DEBUG_MODE" = "true" ]; then
            python main.py --debug
          else
            python main.py
          fi

      - name: Validate generated artifacts
        run: |
          test -s output/RevokeGuard_Auto-Sync.mobileconfig
          test -s output/RevokeGuard_QuantumultX.txt
          test -s output/RevokeGuard_Surge.txt
          test -s output/RevokeGuard_Loon.txt
          test -s output/RevokeGuard_Shadowrocket.txt
          test -s output/RevokeGuard_hosts.txt
          test -s output/domains.txt
          test -s output/metadata.json
          test -s output/enhanced/RevokeGuard_Enhanced.mobileconfig
          test -s output/enhanced/RevokeGuard_Enhanced_QuantumultX.txt
          test -s output/enhanced/RevokeGuard_Enhanced_Surge.txt
          test -s output/enhanced/RevokeGuard_Enhanced_Loon.txt
          test -s output/enhanced/RevokeGuard_Enhanced_Shadowrocket.txt
          test -s output/enhanced/RevokeGuard_Enhanced_hosts.txt
          test -s output/enhanced/enhanced-domains.txt
          test -s output/enhanced/metadata.json
          # Verify the signatures only when this run actually signed. The old
          # step always asserted a CMS signature, which broke unsigned forks,
          # and used -noverify (which skips the chain check, so an expired
          # signing certificate passed unnoticed for months upstream).
          if [ "${{ steps.signing.outputs.signing }}" = "true" ]; then
            for profile in \
              output/RevokeGuard_Auto-Sync.mobileconfig \
              output/enhanced/RevokeGuard_Enhanced.mobileconfig
            do
              openssl smime -verify -inform DER -in "$profile" -noverify -out /dev/null
              echo "signature present: $profile"
            done
          else
            echo "Unsigned run; skipping CMS signature verification."
          fi
          # Guard the behaviour that actually broke app installation: the
          # normal profile must keep the app-verification path reachable, the
          # enhanced profile may block PPQ/VPP but never the appattest family,
          # and enhanced must stay a superset of normal. See
          # scripts/check_profile_contract.py for the exact rules.
          python scripts/check_profile_contract.py

      - name: Remove signing credentials
        if: always()
        run: rm -f fullchain.pem privkey.pem

      - name: Check for output changes
        id: changes
        run: |
          git add output/
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push output changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: update iOS Anti-Revoke rules"
          git push

      - name: Upload generated artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-antirevoke-rules
          path: output/
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## iOS Anti-Revoke Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          if [ -f output/metadata.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("output/metadata.json", encoding="utf-8") as file_handle:
              data = json.load(file_handle)

          print(f"- Apple candidates: {data['apple_source']['candidate_domains']}")
          print(f"- Normal target domains: {data['normal_discovery']['target_domains']}")
          print(f"- Enhanced extra domains: {data['enhanced_discovery']['extra_domains']}")
          print(f"- Enhanced profile domains: {data['enhanced_discovery']['merged_profile_domains']}")
          PY
          fi
